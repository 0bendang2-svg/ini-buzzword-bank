<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Buzzword fact-check questions for Immunity &amp; Infection, with explanations for every answer choice.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>InI Buzzword Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Light blue and white, in every viewing mode. One column, read top to bottom like a question stem. */
:root{--bg:#e3f3fd;--surface:#fff;--ink:#12344d;--muted:#46667c;--line:#bcdcf1;--accent:#7cc6f2;--accent-ink:#0e2d44;--accent-soft:#d6eefc;--link:#0a659f;
--good:#14704a;--good-soft:#e2f4ea;--bad:#b02a1c;--bad-soft:#fdeae6;
--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 var(--body)}
#app{max-width:44rem;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3rem)}h2{font-size:1.25rem}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.9rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:700}
.btn:hover{border-color:var(--link)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{display:grid;gap:10px}
.label{font-weight:700}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--link)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:8px}
.chips .chip{display:flex;justify-content:space-between;gap:12px}
.chips b{font-variant-numeric:tabular-nums}
.chips .n{color:var(--muted);font-variant-numeric:tabular-nums}
#count{width:6rem;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--link)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.ask{color:var(--muted);font-weight:700;display:flex;gap:10px;flex-wrap:wrap}
.flag{color:var(--link)}
.stem{font-family:var(--display);font-weight:600;font-size:clamp(1.3rem,3.6vw,1.65rem);line-height:1.25;text-wrap:pretty}
.choices{display:grid;gap:10px}
.choice{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.pick{display:flex;gap:12px;align-items:baseline;width:100%;border:0;background:none;padding:13px 14px;text-align:left}
.pick:not(:disabled):hover{background:var(--accent-soft)}
.pick:disabled{cursor:default;color:inherit}
.let{font-weight:700;color:var(--muted);flex:none}
.opt{flex:1;min-width:0}
.mark{flex:none;font-weight:700;font-size:.9rem}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .mark,.choice.right .let{color:var(--good)}
.choice.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.chosen-wrong .mark,.choice.chosen-wrong .let{color:var(--bad)}
.foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:0 14px 12px 40px}
.lec{font-size:.875rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.whybtn{border:0;background:none;padding:2px 0;color:var(--link);font-size:.9rem;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.why{padding:0 14px 13px 40px;font-size:.98rem}
.why b{font-weight:700}
.verdict{font-family:var(--display);font-weight:600;font-size:1.15rem}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.nav{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-between;gap:8px;background:var(--bg);padding-block:10px;border-top:1px solid var(--line)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,5rem);line-height:1;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th:last-child,td:last-child{text-align:right}
.tw{overflow-x:auto}
.miss{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.miss li{display:grid;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.err{color:var(--bad);font-size:.95rem}
@media (max-width:420px){.foot,.why{padding-left:14px}}
@media (prefers-reduced-motion:no-preference){.why{animation:in .14s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>

<script>
const B={"E":{"hsv1":{"n":"HSV-1","k":"Which virus?","f":{"lat":"Life-long latency in sensory ganglia, particularly the trigeminal ganglia.","dz":"Above the waist: gingivostomatitis, herpes labialis (cold sores), keratoconjunctivitis, herpetic whitlow, herpes gladiatorum. Most common cause of viral encephalitis.","tr":"Direct contact with secretions, oral-oral. Reactivated by hormonal changes, fever, physical damage.","tx":"Acyclovir, penciclovir, valacyclovir; IV foscarnet for drug-resistant strains."},"L":[41]},"hsv2":{"n":"HSV-2","k":"Which virus?","f":{"lat":"Life-long latency in sensory ganglia, particularly the sacral ganglia.","dz":"Below the waist: genital herpes. Can cause meningitis and neonatal herpes (preventable by cesarean section).","tr":"Direct contact with secretions, sexual."},"L":[41]},"vzv":{"n":"Varicella-zoster virus","k":"Which virus?","f":{"lat":"Dermatomal latency, with reactivation in specific neurons, mainly in the elderly and immunocompromised.","dz":"Primary infection is chicken pox. Reactivation is shingles: painful vesicles, can develop into Bell's palsy. Post-herpetic neuralgia is a common complication.","tr":"Casual contact via respiratory droplets or vesicular fluid.","tx":"Live vaccine Varivax for chicken pox in children; recombinant protein vaccine Shingrix for zoster over age 50. Treated with IV acyclovir, penciclovir, valacyclovir, famciclovir."},"L":[41]},"cmv":{"n":"Cytomegalovirus","k":"Which virus?","f":{"lat":"Infection is lifelong; by advanced age nearly 100% of people are infected.","dz":"Most common infectious cause of congenital birth defects (vision and hearing defects, rash in newborn). 15% of mono cases. Complications in transplant and AIDS patients.","tr":"Direct contact, sexual, transfusion/transplantation, congenital. Nearly 100% infected by advanced age.","tx":"Ganciclovir (IV), valganciclovir (oral), cidofovir or foscarnet. Maribavir if refractory. Letermovir for prophylaxis post renal transplant."},"L":[41]},"ebv":{"n":"Epstein-Barr virus","k":"Which virus?","f":{"lat":"Life-long latency in B cells.","dz":"70% of infectious mono cases. Cancers: African Burkitt's lymphoma, Hodgkin's lymphoma, Asian nasopharyngeal carcinoma, gastric carcinoma. Oral hairy leukoplakia in the immunocompromised.","tr":"Passed through saliva.","tx":"Acyclovir for oral hairy leukoplakia."},"L":[41]},"hhv8":{"n":"HHV-8 (Kaposi's sarcoma herpesvirus)","k":"Which virus?","f":{"lat":"Life-long latency in B cells, with low seroprevalence (1-2%).","dz":"Kaposi's sarcoma (purplish, reddish blue or dark macules, plaques, nodules), multicentric Castleman's disease, body cavity-based lymphoma.","tr":"Exchange of body fluids, sexual contact, organ transplantation.","tx":"In persons with HIV, treatment may include HIV treatment and/or chemotherapy."},"L":[41]},"smallpox":{"n":"Smallpox (variola)","k":"Which virus?","f":{"dz":"Pustular rash; death possible with hemorrhagic smallpox; ARDS.","tr":"Direct contact; sexual.","tx":"Eradicated; potential biological weapon."},"L":[41]},"vaccinia":{"n":"Vaccinia virus","k":"Which virus?","f":{"dz":"Rarely causes infection in immunocompromised vaccine recipients.","tr":"Vaccination or contact with a recent vaccinee.","tx":"The vaccine strain for smallpox and monkeypox."},"L":[41]},"mpox":{"n":"Mpox","k":"Which virus?","f":{"dz":"Formerly monkeypox; similar to smallpox but milder.","tr":"Contact with infected animals (squirrels may be an important reservoir); human-to-human.","tx":"1-10% mortality, 2022 outbreak, smallpox vaccines are cross-protective."},"L":[41]},"molluscum":{"n":"Molluscum contagiosum virus","k":"Which virus?","f":{"dz":"Small dome-shaped skin bumps, sometimes with a central depression; typically childhood; high seroprevalence but not all cases are symptomatic.","tr":"Direct contact.","tx":"Generally self-resolving but can last a year or more."},"L":[41]},"hpv":{"n":"Human papillomavirus","k":"Which virus?","f":{"dz":"Cutaneous, oral and anogenital warts; cervical, anogenital and head/neck cancers.","tr":"Direct contact or contact with surfaces; sexual.","tx":"Over 200 serotypes, about 12 high risk, types 16 and 18 most prevalent. Lesions removed or destroyed; imiquimod; podofilox; Gardasil 9 recombinant subunit vaccine."},"L":[41]},"b19":{"n":"Parvovirus B19","k":"Which virus?","f":{"dz":"Erythema infectiosum (fifth disease) with a \"slapped cheek\" rash; spontaneous abortion and hydrops fetalis; adult polyarthritis; aplastic crisis from destroying erythroid progenitors in sickle cell or immunocompromised patients.","tr":"Respiratory.","tx":"Hyperimmune IgG for the immunocompromised."},"L":[42]},"adeno":{"n":"Adenovirus","k":"Which virus?","f":{"dz":"Respiratory infections (especially in the military), conjunctivitis, infantile gastroenteritis; 5-15% of pediatric viral diarrhea; can lead to pneumonia.","tr":"Respiratory, ocular and fecal/oral.","tx":"Over 50 serotypes; vaccine for common serotypes is military only."},"L":[42]},"bk":{"n":"BK virus","k":"Which virus?","f":{"dz":"Harmless in healthy kids but causes hemorrhagic cystitis in stem cell transplant recipients.","tr":"Droplets; about 80% of adults infected."},"L":[42]},"jc":{"n":"JC virus","k":"Which virus?","f":{"dz":"Progressive multifocal leukoencephalopathy (PML).","tr":"Droplets; about 80% of adults infected."},"L":[42]},"mcpyv":{"n":"Merkel cell polyomavirus","k":"Which virus?","f":{"dz":"Merkel cell carcinoma, a rare but aggressive skin cancer."},"L":[42]},"flu":{"n":"Influenza virus","k":"Which virus?","f":{"dz":"Influenza and pneumonia; antigenic shift causes emergence of novel strains.","tr":"Respiratory droplets.","tx":"Amantadine/rimantadine (often resistant), inhaled zanamivir, oral oseltamivir, IV peramivir; seasonal vaccination."},"L":[42]},"corona":{"n":"Coronavirus","k":"Which virus?","f":{"dz":"Four mild human strains cause 10-30% of common colds. Highly pathogenic outbreaks: SARS-1 (2002), MERS (2012), SARS-2 (2019).","tr":"Respiratory droplets."},"L":[42]},"piv":{"n":"Parainfluenza virus","k":"Which virus?","f":{"dz":"Croup (barking cough, tracheal inflammation), pneumonia, bronchiolitis in children and infants; flu-like symptoms.","tr":"Respiratory droplets."},"L":[42]},"mumps":{"n":"Mumps virus","k":"Which virus?","f":{"dz":"Swollen parotid salivary glands; encephalitis; part of the MMR vaccine.","tr":"Respiratory droplets."},"L":[42]},"measles":{"n":"Measles virus","k":"Which virus?","f":{"dz":"Fever, cough, coryza, conjunctivitis; Koplik spots and macular rash; encephalomyelitis; part of the MMR vaccine.","tr":"Respiratory droplets."},"L":[42]},"rsv":{"n":"Respiratory syncytial virus","k":"Which virus?","f":{"dz":"Bronchiolitis, pneumonia, respiratory infections.","tr":"Respiratory droplets.","tx":"Vaccines approved 2023 for elderly and pre/early pregnancy; aerosol ribavirin and RSV-Ig."},"L":[42]},"mpv":{"n":"Metapneumovirus","k":"Which virus?","f":{"dz":"Pneumonia, bronchitis, bronchiolitis in children and infants.","tr":"Respiratory droplets."},"L":[42]},"hev":{"n":"Hepatitis E virus","k":"Which virus?","f":{"dz":"Acute hepatitis that can be severe during pregnancy.","tr":"Fecally contaminated water, travel to areas with insufficient water sanitation, undercooked game meat."},"L":[44]},"noro":{"n":"Norovirus","k":"Which virus?","f":{"dz":"Gastroenteritis in outbreaks under crowded conditions: schools, camps, military bases, cruise ships.","tr":"Fecal-oral, infected persons, contaminated surfaces, shellfish."},"L":[44]},"rota":{"n":"Rotavirus","k":"Which virus?","f":{"dz":"Vomiting, diarrhea, dehydration, electrolyte loss; wheel-shaped morphology; enterotoxin causes ion dysregulation.","tr":"Fecal-oral.","tx":"Vaccine available, but still 1 million deaths per year where low-income countries cannot widely distribute it."},"L":[44]},"polio":{"n":"Poliovirus","k":"Which virus?","f":{"dz":"Flu-like illness; 1% progress to poliomyelitis with loss of reflexes and flaccid paralysis from destruction of motor neurons; meningitis.","tr":"Fecal-oral via contaminated food or water.","tx":"Salk killed vaccine; Sabin live vaccine no longer used in the U.S.; approaching eradication."},"L":[44]},"echo":{"n":"Echovirus","k":"Which virus?","f":{"dz":"Meningitis, respiratory infections, gastroenteritis (genus Enterovirus)."},"L":[44]},"numev":{"n":"Numbered enteroviruses","k":"Which virus?","f":{"dz":"Upper respiratory infection, conjunctivitis, meningitis; 2014 respiratory outbreak caused by EV-D68."},"L":[44]},"evgen":{"n":"The enteroviruses (genus)","k":"Which virus?","f":{"dz":"Leading cause of meningitis in children; includes echovirus, coxsackievirus and the numbered enteroviruses."},"L":[44]},"rhino":{"n":"Rhinovirus","k":"Which virus?","f":{"dz":"Common cold; stays in the upper respiratory tract because it replicates better at lower temperature; over 100 serotypes.","tr":"Respiratory droplets, hand-to-hand."},"L":[44]},"coxsackie":{"n":"Coxsackievirus","k":"Which virus?","f":{"dz":"Viral exanthems (hand, foot and mouth disease), meningitis, respiratory infections, gastroenteritis. Coxsackie B can cause pleurodynia.","tr":"Fecal-oral via contaminated food or water."},"L":[44]},"hav":{"n":"Hepatitis A virus","k":"Which virus?","f":{"dz":"Acute hepatitis.","tr":"Fecal-oral; travel to countries with poor water sanitation, shellfish, salad bars.","tx":"Vaccine for travel to endemic areas or others at risk; immune globulin for post-exposure prophylaxis."},"L":[44]},"hcv":{"n":"Hepatitis C virus","k":"Which virus?","f":{"dz":"Acute and chronic hepatitis, cirrhosis, HCC; 75% of infections become chronic.","tr":"Transfusion, needle sharing, tattooing, sexual, vertical; almost exclusively blood-to-blood contact.","tx":"NO vaccine; blood supply is screened; antivirals such as Harvoni have over 90% cure rates."},"L":[44]},"hdv":{"n":"Hepatitis Delta virus","k":"Which virus?","f":{"dz":"Co-infection with HBV causes the most severe form of viral hepatitis known to humans.","tr":"Same as HBV.","tx":"Defective satellite RNA virus that needs HBV to replicate; treating HBV helps control it."},"L":[44]},"hbv":{"n":"Hepatitis B virus","k":"Which virus?","f":{"dz":"Hepatitis, cirrhosis, HCC; 5% of infections become chronic; maintained by chronic asymptomatic carriers.","tr":"Secretions, sexual, transfusion, transplant, needle sharing; vertical.","tx":"Vaccine within 24 hours of birth; HBIG immediately post exposure; interferon alpha, tenofovir, entecavir; managed but not cured."},"L":[44]},"wnv":{"n":"West Nile virus","k":"Which virus?","f":{"dz":"Mostly asymptomatic; under 1% get neuroinvasive disease (meningitis, encephalitis, poliomyelitis-like flaccid paralysis); long-term cognitive dysfunction and depression.","tr":"Mosquito bite; spread in the U.S. by birds starting 1999."},"L":[45]},"yf":{"n":"Yellow fever virus","k":"Which virus?","f":{"dz":"Triphasic illness; black vomitus, severe jaundice from hepatic necrosis, Councilman bodies on liver biopsy.","tr":"Mosquito bite.","tx":"Vaccine recommended for travel; think of an unvaccinated traveler back from tropical South America or Sub-Saharan Africa."},"L":[45]},"dengue":{"n":"Dengue virus","k":"Which virus?","f":{"dz":"\"Breakbone fever\": severe myalgias and arthralgias, retro-orbital pain, white-spots-in-a-sea-of-red rash; a different second serotype causes antibody-dependent enhancement and hemorrhagic fever.","tr":"Mosquito bite.","tx":"Dengvaxia only for those in endemic areas with confirmed prior infection."},"L":[45]},"slev":{"n":"St. Louis encephalitis virus","k":"Which virus?","f":{"dz":"Mostly asymptomatic; encephalitis mostly in adults over 60; Parkinsonian tremors; 1/3 of cases have urinary tract involvement.","tr":"Mosquito bite."},"L":[45]},"zika":{"n":"Zika virus","k":"Which virus?","f":{"dz":"Mild illness with non-purulent conjunctivitis; congenital syndrome with microcephaly, ventriculomegaly, intracranial calcifications; linked to Guillain-Barre.","tr":"Mosquito bite and sexual. Named after a forest in Uganda."},"L":[45]},"chik":{"n":"Chikungunya virus","k":"Which virus?","f":{"dz":"Name means \"that which bends\" (stooped posture); severe bilateral polyarthralgia of hands, wrists, feet; high fever, maculopapular rash.","tx":"Live-attenuated vaccines."},"L":[45]},"eee":{"n":"Eastern equine encephalitis virus","k":"Which virus?","f":{"dz":"Highly neurovirulent: rapid altered mental status, seizures, coma; about 30% mortality; swampy Atlantic/Gulf coast areas; first isolated from horses."},"L":[45]},"wee":{"n":"Western equine encephalitis virus","k":"Which virus?","f":{"dz":"Generally milder but significant encephalitis in infants; not reported in the U.S. since 1999, still seen in South America."},"L":[45]},"calenc":{"n":"California encephalitis virus","k":"Which virus?","f":{"dz":"Adults asymptomatic or cold-like; 0.1% of children get high fever, severe headache, prominent GI distress, then encephalitis resembling HSV-1; LaCrosse is more common now.","tr":"Mosquito bite.","tx":"NO vaccine; reduce places where mosquitos breed."},"L":[45]},"hanta":{"n":"Hantavirus","k":"Which virus?","f":{"dz":"Hemorrhagic fever, pulmonary syndrome.","tr":"Dried excretions of rodents."},"L":[45]},"rabies":{"n":"Rabies virus","k":"Which virus?","f":{"dz":"Encephalitic form (80%): hydrophobia, aerophobia, agitation, autonomic instability. Paralytic form (20%): ascends from the bite, often misdiagnosed as Guillain-Barre. Negri bodies post mortem.","tr":"Bite of an infected animal or inhalation of dried fecal matter; reservoirs are dogs, raccoons, skunks, squirrels, foxes, bats.","tx":"Post-exposure passive antibody plus active vaccine; diagnosed by exposure history, antigen in biopsy, RT-PCR of saliva."},"L":[45]},"marburg":{"n":"Marburg virus","k":"Which virus?","f":{"dz":"Hemorrhagic fever from macrophage/dendritic cell infection, cytokine storm, vascular leak, coagulopathy; mortality over 50%.","tr":"Blood and body fluids; bat exposure.","tx":"NO vaccine."},"L":[45]},"ebola":{"n":"Ebola virus","k":"Which virus?","f":{"dz":"Hemorrhagic fever from macrophage/dendritic cell infection, cytokine storm, vascular leak, coagulopathy; mortality over 50%.","tr":"Blood and body fluids; primates.","tx":"Two Ebola (Zaire) vaccines approved; used in a \"ring vaccination\" strategy."},"L":[45]},"prion":{"n":"Prion","k":"Which virus?","f":{"dz":"Transmissible spongiform encephalopathy: holes in cortex, invariably fatal. Variant CJD, kuru, BSE, scrapie.","tr":"Consumption of infected tissues; transplantation, transfusion, pituitary hormone.","tx":"Protein without nucleic acid (not a virus); infectivity is not destroyed by heating or disinfectants."},"L":[45]},"f_herpes":{"n":"Herpesviruses","k":"Which virus family?","f":{"gen":"Linear dsDNA, enveloped, icosahedral.","mem":"HSV-1/2, VZV, CMV, EBV, HHV-8."},"L":[41]},"f_pox":{"n":"Poxviruses","k":"Which virus family?","f":{"gen":"Linear dsDNA, complex shape (not helical or icosahedral), replicates in the cytoplasm.","mem":"Smallpox, vaccinia, mpox, molluscum contagiosum."},"L":[41]},"f_papilloma":{"n":"Papillomaviruses","k":"Which virus family?","f":{"gen":"Circular dsDNA, naked, icosahedral.","mem":"HPV."},"L":[41]},"f_parvo":{"n":"Parvoviruses","k":"Which virus family?","f":{"gen":"Linear ssDNA, naked, icosahedral.","mem":"Human parvovirus B19."},"L":[42]},"f_adeno":{"n":"Adenoviruses","k":"Which virus family?","f":{"gen":"Linear dsDNA, naked, icosahedral.","mem":"Adenovirus."},"L":[42]},"f_polyoma":{"n":"Polyomaviruses","k":"Which virus family?","f":{"gen":"Circular dsDNA, icosahedral.","mem":"BK, JC and Merkel cell polyomavirus."},"L":[42]},"f_ortho":{"n":"Orthomyxoviruses","k":"Which virus family?","f":{"gen":"(-) ssRNA, segmented, enveloped, helical.","mem":"Influenza viruses."},"L":[42]},"f_corona":{"n":"Coronaviruses","k":"Which virus family?","f":{"gen":"(+) ssRNA, enveloped, helical.","mem":"SARS-1, MERS, SARS-2, common-cold coronaviruses."},"L":[42]},"f_paramyxo":{"n": ynthesis of B and T cells.","se":"GI upset, pancytopenia, hypertension, hyperglycemia; associated with invasive CMV infection.","ind":"Lupus."},"L":[53]},"azathioprine":{"n":"Azathioprine","k":"Which agent?","f":{"moa":"Antimetabolite converted to 6-mercaptopurine; blocks purine nucleotide synthesis.","se":"Pancytopenia; 6-MP is degraded by xanthine oxidase, so allopurinol raises toxicity.","ind":"RA, Crohn disease, glomerulonephritis, other autoimmune conditions."},"L":[53]},"sirolimus":{"n":"Sirolimus","k":"Which agent?","f":{"moa":"mTOR inhibitor (rapamycin); binds FKBP; prevents response to IL-2; synergistic with cyclosporine.","se":"Delayed wound healing, hyperlipidemia, proteinuria, mouth ulcerations, bone marrow suppression, pneumonitis, peripheral edema.","ind":"Kidney transplant rejection prophylaxis."},"L":[53]},"glucocort":{"n":"Glucocorticoids","k":"Which agent?","f":{"moa":"Bind glucocorticoid receptor; complex enters the nucleus and turns off pro-inflammatory genes; suppress B and T cells.","se":"Cushing syndrome, osteoporosis, hyperglycemia, cataracts, peptic ulcers, psychosis, avascular necrosis of the femoral head; demargination causes artificial leukocytosis; adrenal insufficiency if stopped abruptly.","ind":"Autoimmune and inflammatory disorders, adrenal insufficiency, asthma, CLL, non-Hodgkin lymphoma."},"L":[53]},"mtx":{"n":"Methotrexate","k":"Which agent?","f":{"moa":"Folate antimetabolite that binds dihydrofolate reductase, inhibiting purine synthesis.","se":"GI upset, cytopenias, elevated liver enzymes; pregnancy category D needing two forms of birth control; give folic acid.","ind":"Chemotherapy, polyarticular JIA, psoriasis, RA."},"L":[53]},"rhogam":{"n":"Anti-Rho(D) (RhoGAM)","k":"Which agent?","f":{"moa":"Antibodies that target B cells making anti-Rho(D) for destruction.","ind":"Pregnancy where the mother is Rh(D)-negative and child Rh(D)-positive."},"L":[53]},"rituximab":{"n":"Rituximab","k":"Which agent?","f":{"moa":"Monoclonal antibody targeting CD20 on B cells.","se":"Infusion-related reactions can be severe.","ind":"Graft rejection, CD20+ non-Hodgkin's lymphoma, CLL, pemphigus vulgaris, ITP, AIHA."},"L":[52,53]},"tnfmabs":{"n":"Adalimumab, certolizumab, infliximab","k":"Which agent?","f":{"moa":"Monoclonal antibodies against TNF-alpha.","ind":"IBD, RA, AS, psoriasis."},"L":[52]},"canakinumab":{"n":"Canakinumab","k":"Which agent?","f":{"moa":"Monoclonal antibody against IL-1 beta.","ind":"Multiple autoinflammatory disorders."},"L":[52]},"c_cni":{"n":"Calcineurin inhibitors","k":"Which immunosuppressive class?","f":{"moa":"Prevent IL-2 transcription; both are highly nephrotoxic, especially at high doses or with decreased renal function."},"L":[53]},"c_mtor":{"n":"mTOR inhibitors","k":"Which immunosuppressive class?","f":{"moa":"Prevent the response to IL-2 (sirolimus)."},"L":[53]},"c_impdh":{"n":"IMP dehydrogenase inhibitors","k":"Which immunosuppressive class?","f":{"moa":"Prevent purine synthesis in B and T cells (mycophenolate)."},"L":[53]},"c_antimet":{"n":"Purine antimetabolites","k":"Which immunosuppressive class?","f":{"moa":"Azathioprine, converted to 6-MP, blocks purine nucleotide synthesis."},"L":[53]},"r_resp":{"n":"Respiratory droplets","k":"Which transmission route?","f":{"r":"Listed for influenza, coronaviruses, parainfluenza, mumps, measles, RSV, metapneumovirus, rhinovirus, BK and JC viruses; parvovirus B19 is listed as respiratory."},"L":[42]},"r_fecal":{"n":"Fecal-oral","k":"Which transmission route?","f":{"r":"Listed for norovirus, rotavirus, polio, coxsackievirus and hepatitis A; hepatitis E through contaminated water."},"L":[44]},"r_mosq":{"n":"Mosquito bite","k":"Which transmission route?","f":{"r":"Listed for West Nile, yellow fever, dengue, St. Louis encephalitis, Zika, equine and California encephalitis."},"L":[45]},"r_direct":{"n":"Direct contact","k":"Which transmission route?","f":{"r":"Listed for HSV, smallpox, molluscum contagiosum and HPV."},"L":[41]},"r_blood":{"n":"Blood and body fluids","k":"Which transmission route?","f":{"r":"Listed for hepatitis B, hepatitis C, Marburg and Ebola."},"L":[45]},"c_hbvnuc":{"n":"Nucleoside/nucleotide analogs (HBV)","k":"Which drug class?","f":{"moa":"Effectively suppress Hep B but uncommonly cure. All listed anti-HBV drugs are in this group."},"L":[47]},"calb":{"n":"Candida albicans","k":"Which fungus?","f":{"dz":"Candidiasis: thrush (white patches on mucosal membranes), genital yeast infection, endocarditis particularly in those who use intravenous drugs.","rs":"Normal flora in GI and GU tract and skin.","loc":"Mucosal membranes (mouth, vagina) and moist skin.","note":"Can be passed from mother to infant during birth; infections occur in the immunocompetent but are worse in the immunocompromised (HIV)."},"L":[54]},"cauris":{"n":"Candida auris","k":"Which fungus?","f":{"dz":"Fungemia, invasive infection, high mortality.","rs":"Hospitalized patients, those who have received antifungal agents.","loc":"Blood.","note":"Often pan-resistant to antifungals; emerging fungal pathogen (cases still low)."},"L":[54]},"crypto":{"n":"Cryptococcus neoformans","k":"Which fungus?","f":{"dz":"Cryptococcosis: pneumonia, meningitis (photophobia, stiff neck, headache).","rs":"Inhalation; associated with pigeon droppings.","loc":"Lungs, brain, meninges.","mor":"Encapsulated budding yeast.","note":"Important in HIV (CD4<100); treat prophylactically."},"L":[54]},"pcp":{"n":"Pneumocystis jiroveci","k":"Which fungus?","f":{"dz":"Lifelong asymptomatic colonization is common; Pneumocystis pneumonia is a diffuse interstitial pneumonia with arterial hypoxia and respiratory distress.","rs":"Person-to-person; risk factors are immunocompromise (AIDS, Hyper-IgM syndrome, corticosteroid use).","loc":"Lung.","mor":"Unusual \"yeast-like\" morphology."},"L":[54]},"derm":{"n":"Dermatophytes","k":"Which fungus?","f":{"dz":"Tinea (ringworm): non-invasive, hypersensitivity reaction, raised \"ring\" rash, hair loss.","rs":"Person- or animal-to-person; immune suppression, contact with infected people or animals, skin that stays moist.","loc":"Keratinized tissue (moist areas), skin, hair, nails.","mor":"Mold with varying morphology.","note":"Diseases named for the area of body found, such as tinea pedis.","mem":"Trichophyton, Microsporum, Epidermophyton."},"L":[54]},"asper":{"n":"Aspergillus fumigatus","k":"Which fungus?","f":{"dz":"Aspergilloma (fungus ball), allergic bronchopulmonary aspergillosis, COVID19- and influenza-associated pulmonary aspergillosis, angioinvasive aspergillosis (brain lesions, endocarditis, kidney failure); aflatoxin is linked to hepatocellular carcinoma.","rs":"Ubiquitous in environment; inhalation.","mor":"Mold with septated hyphae and acute angle branching.","loc":"Lung."},"L":[54]},"mucor":{"n":"Rhizopus / Mucor","k":"Which fungus?","f":{"dz":"Mucormycosis: rhinocerebral (nasal passages spreading to brain), pulmonary, cutaneous (cellulitis with rapidly progressing necrotic lesions), disseminated (most commonly brain).","rs":"Risk factors are deferoxamine, neutropenia, burns, organ transplant.","mor":"Broad non-septate hyphae at right 90 degree angles.","loc":"Lung, skin.","note":"Diagnosis by biopsy; tissue histopath shows non-septate hyphae at right 90 degree angles."},"L":[54]},"fusarium":{"n":"Fusarium","k":"Which fungus?","f":{"mor":"Pea-pod or banana-shaped hyphae (not on exam).","dz":"Post traumatic keratitis, sinopulmonary disease, skin lesions, dissemination in burn patients or prolonged neutropenia, high mortality (not on exam).","rs":"Soil; neutropenia; skin breakdown (not on exam)."},"L":[54]},"histo":{"n":"Histoplasma capsulatum","k":"Which fungus?","f":{"dz":"Histoplasmosis: asymptomatic in 95%, mild self-limiting flu-like symptoms, or granulomatous disease progressing to cavitary.","rs":"Soil contaminated with bird or bat droppings; travel to Mississippi and Ohio river valleys; immune compromise.","loc":"Lung.","mor":"Dimorphic: small yeast form at 37°C in macrophages; fungal form at 25°C with septated hyphae and macro- and micro-conidia."},"L":[54]},"blasto":{"n":"Blastomyces dermatitidis","k":"Which fungus?","f":{"dz":"Blastomycosis: granulomatous nodules in lungs and skin; disseminated infection (skin, bone, genitourinary tract, CNS, spleen).","rs":"No known reservoir, common in wet soil covered in leaves; travel to Eastern and Central U.S., Africa, Asia.","mor":"Dimorphic: broad based budding yeast in host.","note":"SE US, upper Midwest US."},"L":[54]},"cocci":{"n":"Coccidioides immitis","k":"Which fungus?","f":{"dz":"Coccidioidomycosis (\"Valley Fever\"): arthroconidia inhaled in dust; pneumonia, cavities, erythema nodosum (desert bumps), multiforme arthralgias (desert rheumatism), eosinophilic meningitis.","rs":"Inhalation; dry soil in southwest U.S. desert; immune compromise, pregnancy, diabetes.","mor":"Dimorphic: spherules filled with endospores in host.","note":"SW US."},"L":[54]},"paracocci":{"n":"Paracoccidioides","k":"Which fungus?","f":{"mor":"Dimorphic: thick walled yeast with multiple buds, \"Captain's wheel\" (not on exam).","dz":"Hoarseness, lymphadenitis, painful lesions of gums, tongue, lips, palate (not on exam).","rs":"Travel to Latin America where it is endemic (not on exam).","note":"South America, Central America (not on exam)."},"L":[54]},"g_yeast":{"n":"Yeasts","k":"Which fungal group?","f":{"g":"Listed for Candida albicans, Candida auris and Cryptococcus neoformans."},"L":[54]},"g_ylike":{"n":"Yeast-like","k":"Which fungal group?","f":{"g":"Listed for Pneumocystis jiroveci."},"L":[54]},"g_mold":{"n":"Molds","k":"Which fungal group?","f":{"g":"Listed for dermatophytes, Aspergillus fumigatus, Rhizopus/Mucor and Fusarium."},"L":[54]},"g_dim":{"n":"Dimorphic","k":"Which fungal group?","f":{"g":"Listed for Histoplasma, Blastomyces, Coccidioides and Paracoccidioides."},"L":[54]},"azoles":{"n":"Azoles (as a class)","k":"Which antifungal?","f":{"moa":"Interfere with ergosterol synthesis by inhibiting fungal cyt P450 enzyme.","ci":"Interact w/ host CYT P450 enzymes; teratogenic and embryotoxic in animals; do not use w/ drugs which prolong QT interval.","ae":"Generally well tolerated; GI distress and HA/dizziness most common; elevated liver enzymes; prolonged QT interval and torsades.","pk":"Imidazoles are topical only; triazoles are systemic and topical."},"L":[55]},"imid":{"n":"Imidazoles (1st gen)","k":"Which antifungal?","f":{"pk":"Topical only.","moa":"Azole mechanism: inhibit fungal cyt P450 enzyme."},"L":[55]},"triaz":{"n":"Triazoles (2nd gen)","k":"Which antifungal?","f":{"pk":"Used for systemic and topical therapy.","moa":"Azole mechanism: inhibit fungal cyt P450 enzyme."},"L":[55]},"fluco":{"n":"Fluconazole","k":"Which antifungal?","f":{"pk":"Oral and IV; good distribution with high CNS levels; primarily renal disposition; long T1/2.","moa":"Typical azole mechanism.","ci":"Caution w/ renal impairment; CI in pregnancy especially at high doses.","ae":"High doses can cause alopecia, dry mouth, muscle weakness.","sp":"Superficial candidiasis; cryptococcosis including meningitis."},"L":[55]},"itra":{"n":"Itraconazole","k":"Which antifungal?","f":{"pk":"Oral (decreased pH favors absorption), IV, vaginal suppository; good distribution EXCEPT CSF; hepatic metabolism; long T1/2.","moa":"Typical azole mechanism.","ci":"Liver disease, heart failure; potent P450 inhibitor with many drug interactions.","ae":"Rare cardiotoxicity and hepatotoxicity.","sp":"Broader than fluconazole: histoplasmosis, blastomycosis, candida spp. including fluconazole resistant strains."},"L":[55]},"vori":{"n":"Voriconazole","k":"Which antifungal?","f":{"pk":"Oral and IV; good distribution into CNS; primarily hepatic metabolism.","moa":"Typical azole mechanism.","ci":"Liver disease; caution w/ renal impairment (IV formulation only); teratogenic, not during pregnancy.","ae":"30% reversible visual disturbances; skin rashes/photosensitivity.","sp":"Broader than fluconazole and itraconazole: invasive aspergillosis, scedosporium, fusarium, fluconazole resistant candida."},"L":[55]},"posa":{"n":"Posaconazole","k":"Which antifungal?","f":{"pk":"Oral (decreased pH favors absorption) and IV; good distribution EXCEPT CNS; fecal elimination.","moa":"Typical azole mechanism.","ci":"Antacid drugs impair absorption; caution w/ renal impairment (IV formulation only).","ae":"Typical of azoles.","sp":"Broadest spectrum of azoles: Px and Tx of candida and aspergillus in severely immunocompromised patients, zygomycosis, mucormycosis, nonresponsive aspergillosis."},"L":[55]},"isav":{"n":"Isavuconazonium","k":"Which antifungal?","f":{"pk":"Oral and IV; gets into CNS; long t1/2; hepatic metabolism then fecal/renal elimination.","moa":"Prodrug converted to isavuconazole, then typical triazole MOA.","ci":"Typical of azoles plus liver disease.","ae":"Typical of azoles plus infusion reactions.","sp":"Similar spectrum as posaconazole; approved for invasive aspergillosis and mucormycosis."},"L":[55]},"otes":{"n":"Oteseconazole","k":"Which antifungal?","f":{"pk":"Oral; T1/2 of 138 days.","moa":"Typical azole mechanism.","ci":"Contraindicated if pregnant or could become pregnant (must be infertile).","ae":"No QT prolongation at 5 X the max dose.","sp":"Recurrent vulvovaginal candidiasis."},"L":[55]},"clot":{"n":"Clotrimazole","k":"Which antifungal?","f":{"pk":"Topical and oral lozenge preps; limited absorption except some w/ oral lozenges.","moa":"Imidazole; typical azole mechanism.","ci":"Intravaginal prep may interfere w/ contraceptives; only oral lozenges are contraindicated in pregnancy.","ae":"Local irritation, stinging, burning, polyuria w/ intravaginal admin.","sp":"Vaginal, superficial and oral candidiasis; dermatophytic infections."},"L":[55]},"echino":{"n":"Echinocandins","k":"Which antifungal?","f":{"moa":"Inhibit synthesis of 1,3-beta-D-glucan, a component of the fungal cell wall; given IV.","pk":"IV only; redistribution and slow metabolism.","ci":"Relatively few drug interactions; teratogenic in animals; decrease dose w/ hepatic impairment.","ae":"Well tolerated; histamine release effects (rash, itching, flushing), also N&V.","sp":"Aspergillosis, severe Candida infections, esophageal candidiasis.","mem":"Micafungin, anidulafungin, caspofungin, rezafungin."},"L":[55]},"ibrex":{"n":"Ibrexafungerp","k":"Which antifungal?","f":{"moa":"ORAL inhibitor of 1,3-beta-D-glucan synthesis.","pk":"Oral; hepatic metabolism (cyp3A4); long t1/2 decreases tx duration.","ci":"Fetal risk, avoid in pregnancy; decrease dose w/ hepatic impairment; avoid with strong cyp3A4 inhibitors.","ae":"GI N/V/D and dizziness.","sp":"Approved for VVC; active against many Candida spp. and Aspergillosis; no cross tolerance w/ azoles, amphotericin or echinocandins."},"L":[55]},"ampho":{"n":"Amphotericin B","k":"Which antifungal?","f":{"moa":"Binds to ergosterol, altering permeability with loss of ions and irreversible damage.","pk":"IV primarily, also intrathecal; wide distribution except CNS; 90% protein bound; slow elimination by kidney.","ci":"Renal impairment, other nephrotoxic drugs; synergy w/ flucytosine and azoles; safe during pregnancy.","ae":"Deoxycholate: common nephrotoxicity and infusion reactions (fever/chills, hypotension, hypokalemia, anemia, shock). Lipid preps: minimal nephrotoxicity, expensive.","sp":"Rapidly progressing/severe mycoses including CNS infections, broad spectrum; induction therapy followed by oral azole."},"L":[55]},"giardia":{"n":"Giardia","k":"Which protozoan?","f":{"dz":"Chronic fatty diarrhea, sulphur smelling flatulence and eructation.","tr":"Fecal-oral, usually via water; camping/drinking from streams.","dx":"Dx: stool O&P, DFA, PCR, EIA. Rx: metronidazole.","ep":"Worldwide."},"L":[58]},"cryptosp":{"n":"Cryptosporidium","k":"Which protozoan?","f":{"dz":"Minor GI symptoms, but severe in people with T-cell deficiencies such as advanced HIV.","tr":"Fecal-oral, usually via water.","dx":"Dx: stool O&P for cysts and trophozoites, serum antibodies, PCR. Rx: nitazoxanide.","ep":"Worldwide."},"L":[58]},"ehist":{"n":"Entamoeba histolytica","k":"Which protozoan?","f":{"dz":"Amoebiasis/amebic dysentery: dysentery, peritonitis, luminal perforation, extraintestinal abscesses (usually liver).","tr":"Fecal-oral.","dx":"Dx: cysts on stool ova and parasite exam, ELISA, Ag test, PCR. Rx: metronidazole + paromomycin.","rf":"Risk factors are MSM and travel; liver abscess.","ep":"Worldwide, higher prevalence in low-income countries."},"L":[58]},"naegleria":{"n":"Naegleria fowleri","k":"Which protozoan?","f":{"dz":"Primary amebic meningoencephalitis: rapidly progressing neurologic damage with very high mortality if not treated early.","tr":"Direct inoculation of fresh water through the cribriform plate; water skiing.","dx":"Dx: CSF microscopy or PCR, brain biopsy. Tx: optimal treatment unknown."},"L":[58]},"acanth":{"n":"Acanthamoeba","k":"Which protozoan?","f":{"dz":"Granulomatous amebic encephalitis (GAE) and amebic keratitis.","tr":"CNS entry through nasal passage or damaged skin; keratitis from direct inoculation to the eye with contact lens use.","dx":"Dx: amebae/cysts in tissue. Tx: topical cationic antiseptics for the eye; CNS treatment unknown.","rf":"Contact lenses."},"L":[58]},"toxo":{"n":"Toxoplasma gondii","k":"Which protozoan?","f":{"dz":"Toxoplasmosis: congenital infection (chorioretinitis, microcephaly, hydrocephalus, diffuse intracranial calcifications), chorioretinitis, cerebral toxo.","tr":"Oocysts through infected meat, milk, cat feces; vertical transmission.","dx":"Dx: serology with avidity, ELISA, PCR, blood smear. Tx: pyrimethamine, sulfadiazine + folinic acid, TMP-SMX; spiramycin in utero.","rf":"Significant disease in newborns and immunocompromised (HIV); estimated 60 million cases in U.S."},"L":[58]},"leish":{"n":"Leishmania","k":"Which protozoan?","f":{"dz":"Leishmaniasis: cutaneous ulcers with raised edges, mucosal espundia (nasal stuffiness, naso-oropharyngeal destruction), visc   ${done?`<p class="verdict ${gotIt?"ok":"no"}" role="status">${gotIt?"Correct. Open any choice below to see why it is right or wrong.":`Incorrect. The answer is ${esc(B.E[q.a].n)}.`}</p>`:""}
  <div class="choices">${ch}</div>
  <div class="nav"><span class="row"><button class="btn" data-act="prev" ${r.i?"":"disabled"}>Previous</button><button class="btn quiet" data-act="finish">End exam</button></span><button id="next" class="btn primary" data-act="next" ${done?"":"disabled"}>${last?"See results":"Next question"}</button></div>`;
}
function results(){
  const r=S.run,rows={};let right=0,tot=0;const missed=[];
  r.items.forEach((it,i)=>{const a=r.ans[i];if(a===undefined)return;const q=B.Q[it.q];tot++;rows[q.l]=rows[q.l]||[0,0];rows[q.l][1]++;if(a===q.a){right++;rows[q.l][0]++}else missed.push({q,a,qi:it.q})});
  const pct=tot?Math.round(right/tot*100):0;
  const body=Object.keys(rows).sort((a,b)=>a-b).map(l=>`<tr><td>${l}</td><td>${esc(NAMES[l])}</td><td>${rows[l][0]} / ${rows[l][1]}</td></tr>`).join("");
  const miss=missed.map(m=>`<li><span>${esc(m.q.s)}</span><span><b>${esc(B.E[m.q.a].n)}</b> <span class="lec">${lecText(m.q,m.q.a)}</span></span><span class="muted small">You chose ${esc(B.E[m.a].n)}</span></li>`).join("");
  app.innerHTML=`<header class="sec"><h1>Results</h1><p class="score">${pct}%</p><p>${right} of ${tot} correct${tot<r.items.length?`, ${r.items.length-tot} left unanswered`:""}.</p></header>
  <div class="row">${missed.length?`<button class="btn primary" data-act="retry">Retake the ${missed.length} missed</button>`:""}<button class="btn${missed.length?"":" primary"}" data-act="new">New exam</button></div>
  ${tot?`<div class="sec"><h2>By lecture</h2><div class="tw"><table><thead><tr><th>Lecture</th><th>Topic</th><th>Correct</th></tr></thead><tbody>${body}</tbody></table></div></div>`:""}
  ${missed.length?`<div class="sec"><h2>Missed questions</h2><ul class="miss">${miss}</ul></div>`:""}`;
}
function render(){({setup,quiz,results})[S.view]()}
app.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,r=S.run;
  if(a==="lec"){const l=b.dataset.l;S.lecs=S.lecs.includes(l)?S.lecs.filter(x=>x!==l):[...S.lecs,l];render();document.querySelector(`[data-l="${l}"]`).focus()}
  else if(a==="all"){S.lecs=LECS.slice();render()}
  else if(a==="none"){S.lecs=[];render()}
  else if(a==="preset"){S.count=b.dataset.n;render()}
  else if(a==="start"){const p=pool(),n=Math.min(parseInt(S.count,10),p.length);begin(shuffle(p).slice(0,n))}
  else if(a==="pick"){r.ans[r.i]=b.dataset.id;render();document.getElementById("next").focus({preventScroll:true})}
  else if(a==="why"){const k=b.dataset.k,box=b.parentElement.nextElementSibling;r.open[k]=!r.open[k];box.hidden=!r.open[k];b.setAttribute("aria-expanded",r.open[k])}
  else if(a==="next"){next()}
  else if(a==="prev"){r.i--;render();window.scrollTo(0,0)}
  else if(a==="finish"){S.view="results";render();window.scrollTo(0,0)}
  else if(a==="retry"){const m=r.items.filter((it,i)=>r.ans[i]!==undefined&&r.ans[i]!==B.Q[it.q].a).map(it=>it.q);begin(shuffle(m))}
  else if(a==="new"){S.view="setup";S.run=null;render();window.scrollTo(0,0)}
});
function next(){const r=S.run;if(r.ans[r.i]===undefined)return;if(r.i===r.items.length-1)S.view="results";else r.i++;render();window.scrollTo(0,0)}
app.addEventListener("input",ev=>{if(ev.target.id!=="count")return;S.count=ev.target.value;const avail=pool().length,n=parseInt(S.count,10),bad=!avail||!(n>=1),h=document.getElementById("hint");h.textContent=hint(n,avail);h.className=bad?"err":"muted small";document.getElementById("start").disabled=bad;document.querySelectorAll('[data-act="preset"]').forEach(c=>c.setAttribute("aria-pressed",+c.dataset.n===n))});
document.addEventListener("keydown",ev=>{if(S.view!=="quiz"||ev.metaKey||ev.ctrlKey||ev.altKey)return;const r=S.run,done=r.ans[r.i]!==undefined;const k=ev.key.toLowerCase();const n="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);if(!done&&n>=0&&k.length===1){r.ans[r.i]=r.items[r.i].o[n];render();document.getElementById("next").focus({preventScroll:true})}});
window.claude?.hot?.snapshot?.(()=>({S}));
function start(d){if(d&&d.S)S=d.S;render()}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
